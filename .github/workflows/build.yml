name: Windows build and tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore locked dependencies
        run: dotnet restore RawSpeed.sln --locked-mode
      - name: Build and run generated-fixture tests
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Publish Windows x64
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RawSpeed-win-x64
          path: artifacts/publish/win-x64/
